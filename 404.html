<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 道氏理论</title>
<style>
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f3eee2; color: #171410; font-family: "Songti SC", "STSong", "SimSun", serif; }
  .box { text-align: center; padding: 32px; }
  .mark { width: 54px; height: 54px; margin: 0 auto 24px; display: grid; place-items: center; border: 1px solid #a93b2a; color: #a93b2a; font-size: 28px; }
  h1 { margin: 0; font-size: clamp(34px, 6vw, 64px); font-weight: 700; letter-spacing: -0.04em; }
  p { margin: 18px 0 0; color: #746c5b; font-family: "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.9; }
  a { display: inline-block; margin-top: 26px; padding: 12px 22px; border: 1px solid #171410; border-radius: 999px; color: #171410; text-decoration: none; font-family: "Microsoft YaHei", sans-serif; font-size: 13px; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">道</div>
  <h1>这一页不在书里</h1>
  <p>链接可能已经改变，或者这一页从未存在。</p>
  <a id="home" href="./">回到首页</a>
</div>
<script>
  (function () {
    var parts = location.pathname.split("/").filter(Boolean);
    var home = "/" + (parts.length > 0 ? parts[0] + "/" : "");
    var link = document.getElementById("home");
    link.href = home;
  })();
</script>
</body>
</html>
